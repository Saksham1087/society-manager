<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Society Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #receiptModal, #receiptModal * { visibility: visible; }
      #receiptModal {
        position: fixed; inset: 0; display: flex !important;
        align-items: center; justify-content: center;
      }
      #receiptModal > div { box-shadow: none; border: 1px solid #ccc; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans antialiased">

  <header class="bg-blue-700 text-white px-4 py-4 shadow-md no-print">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <h1 class="text-xl font-bold tracking-tight">Society Management</h1>
      <span class="text-blue-200 text-sm">SMS</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pb-8">
    <nav class="flex mt-4 rounded-lg overflow-hidden shadow-sm no-print" role="tablist">
      <button id="tabMaintenance" class="flex-1 py-3 text-sm font-semibold text-center transition"
              role="tab" aria-selected="true">Maintenance</button>
      <button id="tabExpenses" class="flex-1 py-3 text-sm font-semibold text-center transition"
              role="tab" aria-selected="false">Expenses</button>
    </nav>

    <section id="moduleMaintenance" class="mt-6" role="tabpanel">
      <div class="bg-white rounded-xl shadow-sm p-5 space-y-4">
        <h2 class="text-lg font-bold text-gray-800 border-b pb-2">Maintenance Entry</h2>
        <form id="formMaintenance" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Wing</label>
            <select id="maintWing" required
                    class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="">Select Wing</option>
              <option>A</option><option>B</option><option>C</option><option>D</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Unit Number</label>
            <input type="text" id="maintUnit" required placeholder="e.g. 101"
                   class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Owner Name</label>
            <input type="text" id="maintName" required placeholder="Full name"
                   class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Amount (₹)</label>
            <input type="number" id="maintAmount" required min="1" step="0.01" placeholder="0.00"
                   class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Month</label>
            <select id="maintMonth" required
                    class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="">Select Month</option>
              <option>January</option><option>February</option><option>March</option>
              <option>April</option><option>May</option><option>June</option>
              <option>July</option><option>August</option><option>September</option>
              <option>October</option><option>November</option><option>December</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Year</label>
            <input type="number" id="maintYear" required min="2020" max="2100" placeholder="2026"
                   class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Payment Mode</label>
            <select id="maintMode" required
                    class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="">Select Mode</option>
              <option>Cash</option><option>Cheque</option><option>UPI</option><option>Bank Transfer</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Receipt No.</label>
            <input type="text" id="maintReceipt" required placeholder="RCP-001"
                   class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div class="sm:col-span-2 flex gap-3">
            <button type="submit"
                    class="no-print flex-1 bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg transition text-sm">
              Save Maintenance
            </button>
            <button type="button" id="btnMaintReceipt"
                    class="no-print flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded-lg transition text-sm">
              View Receipt
            </button>
          </div>
        </form>
      </div>

      <div class="mt-6 bg-white rounded-xl shadow-sm p-5">
        <h3 class="text-md font-bold text-gray-800 mb-3">Recent Maintenance</h3>
        <div id="maintList" class="space-y-2 text-sm text-gray-600">No records yet.</div>
      </div>
    </section>

    <section id="moduleExpenses" class="mt-6 hidden" role="tabpanel">
      <div class="bg-white rounded-xl shadow-sm p-5 space-y-4">
        <h2 class="text-lg font-bold text-gray-800 border-b pb-2">Expense Entry</h2>
        <form id="formExpenses" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Category</label>
            <select id="expCategory" required
                    class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="">Select Category</option>
              <option>Electricity</option><option>Water</option><option>Cleaning</option>
              <option>Security</option><option>Repairs</option><option>Gardening</option>
              <option>Other</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Amount (₹)</label>
            <input type="number" id="expAmount" required min="1" step="0.01" placeholder="0.00"
                   class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Date</label>
            <input type="date" id="expDate" required
                   class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Payee / Vendor</label>
            <input type="text" id="expVendor" required placeholder="Vendor name"
                   class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Payment Mode</label>
            <select id="expMode" required
                    class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="">Select Mode</option>
              <option>Cash</option><option>Cheque</option><option>UPI</option><option>Bank Transfer</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-1">Bill / Ref No.</label>
            <input type="text" id="expBillNo" required placeholder="BILL-001"
                   class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-sm font-medium text-gray-600 mb-1">Description</label>
            <textarea id="expDescription" rows="2" placeholder="Optional notes"
                      class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
          </div>
          <div class="sm:col-span-2">
            <button type="submit"
                    class="no-print w-full bg-green-700 hover:bg-green-800 text-white font-semibold py-2.5 rounded-lg transition text-sm">
              Save Expense
            </button>
          </div>
        </form>
      </div>

      <div class="mt-6 bg-white rounded-xl shadow-sm p-5">
        <h3 class="text-md font-bold text-gray-800 mb-3">Recent Expenses</h3>
        <div id="expenseList" class="space-y-2 text-sm text-gray-600">No records yet.</div>
      </div>
    </section>
  </main>

  <div id="receiptModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full mx-4 p-6 print:shadow-none print:border">
      <div class="text-center border-b pb-3 mb-4">
        <h2 class="text-lg font-bold text-gray-800">Payment Receipt</h2>
        <p class="text-xs text-gray-500">Society Management System</p>
      </div>
      <table class="w-full text-sm" id="receiptBody">
        <tbody></tbody>
      </table>
      <div class="mt-5 flex gap-3 no-print">
        <button id="btnPrintReceipt"
                class="flex-1 bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2 rounded-lg transition text-sm">
          Print
        </button>
        <button id="btnCloseReceipt"
                class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 rounded-lg transition text-sm">
          Close
        </button>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
